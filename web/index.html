<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Livros</title>
    <link rel="stylesheet" href="/web/style.css">
</head>
<body>
    <main>
        <h1>Livros</h1>

        <h2>Cadastrar ou editar</h2>
        <form id="form-livro">
            <label for="titulo">Título</label>
            <input id="titulo" required>
            <label for="autor">Autor</label>
            <input id="autor" required>
            <button id="salvar" type="submit">Cadastrar</button>
            <button id="cancelar" type="button" hidden>Cancelar edição</button>
        </form>

        <h2>Buscar</h2>
        <form id="form-busca">
            <label for="id-busca">ID do livro</label>
            <input id="id-busca" type="number" min="1" required>
            <button type="submit">Buscar</button>
            <button id="mostrar-todos" type="button">Listar todos</button>
        </form>

        <p id="mensagem" role="status"></p>

        <div class="tabela">
            <table>
                <thead>
                    <tr><th>ID</th><th>Título</th><th>Autor</th><th>Ações</th></tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </main>

    <script src="/web/script.js" defer></script>
</body>
</html>
